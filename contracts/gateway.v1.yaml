openapi: 3.1.0
info:
  title: SyncroBrain Cloud Lite Gateway
  version: 0.1.0
  description: |
    Product Iterate HTTP surface on iot-gateway (NestJS Fastify).
    Server default is http://localhost:13200/api/v1.
    Device CRUD in device.v1.yaml is a legacy subset and is not the Cloud Lite contract.
servers:
  - url: http://localhost:13200/api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Gateway + ThingsBoard ping (TB_MODE=fake reports up)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ops/inventory:
    get:
      operationId: opsInventory
      responses:
        "200":
          description: Pilot inventory (no secrets)
  /branding:
    get:
      operationId: branding
      responses:
        "200":
          description: White-label stub
  /license:
    get:
      operationId: licenseStatus
      responses:
        "200":
          description: Offline license (report_only or block)
  /entitlement/skus:
    get:
      operationId: listSkus
      responses:
        "200":
          description: Configurable SKU catalog
  /auth/demo:
    post:
      operationId: demoLogin
      responses:
        "200":
          description: Demo JWT when CASBIN_DEV_OPEN=true
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
        "403":
          description: CASBIN_DEV_OPEN is not true
  /packs:
    get:
      operationId: listPacks
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Industry Pack catalog
  /demos/cold-lab:
    post:
      operationId: demoColdLab
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoBootstrapRequest"
      responses:
        "201":
          description: Project + Pack + site + asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoBootstrap"
  /demos/env-lab:
    post:
      operationId: demoEnvLab
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoBootstrapRequest"
      responses:
        "201":
          description: env-lab room demo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoBootstrap"
  /alarms:
    get:
      operationId: listAlarms
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Alarm rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlarmRow"
  /alarms/export.csv:
    get:
      operationId: exportAlarmsCsv
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
  /alarms/{id}/ack:
    post:
      operationId: ackAlarm
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Acknowledged row
  /assets/{id}/simulate/overtemp:
    post:
      operationId: simulateOvertemp
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Telemetry + CRITICAL alarm
  /projects:
    get:
      operationId: listProjects
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Project list
    post:
      operationId: createProject
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /projects/{id}:
    get:
      operationId: getProject
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Project
    delete:
      operationId: deleteProject
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Removed mapped assets and TB tenant
  /projects/{id}/sites:
    get:
      operationId: listSites
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sites
    post:
      operationId: createSite
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Site
  /projects/{id}/packs/apply:
    post:
      operationId: applyPack
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pack application
  /assets:
    get:
      operationId: listAssets
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Asset maps
  /assets/{id}/telemetry:
    get:
      operationId: getAssetTelemetry
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Telemetry
  /audit-events:
    get:
      operationId: listAuditEvents
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Append-only audit
  /incidents:
    get:
      operationId: listIncidents
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Domain incidents
  /incidents/{id}/ack:
    post:
      operationId: ackIncident
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Acknowledged
  /incidents/{id}/escalate:
    post:
      operationId: escalateIncident
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Escalated using duty roster
  /incidents/{id}/close:
    post:
      operationId: closeIncident
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Closed after ack
  /sites/{id}/duty-roster:
    get:
      operationId: getDutyRoster
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Site duty roster
    put:
      operationId: putDutyRoster
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Replaced duty roster
  /calibrations:
    get:
      operationId: listCalibrations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Calibration certificates
    post:
      operationId: createCalibration
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /reports:
    get:
      operationId: listReports
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Compliance reports
    post:
      operationId: createReport
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /reports/{id}/export:
    post:
      operationId: exportReport
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: CSV body plus metadata
  /assets/{id}/channels:
    get:
      operationId: listAssetChannels
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sensor channels seeded from Pack
  /work-orders:
    get:
      operationId: listWorkOrders
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Work orders from incident close
  /commands:
    post:
      operationId: dispatchCommand
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Command accepted or denied
    get:
      operationId: listCommands
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Command history
  /edge/commands:
    get:
      operationId: pullEdgeCommands
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pending outbox command payloads for EdgeAgent
  /edge/commands/receipt:
    post:
      operationId: edgeCommandReceipt
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Command receipt; marks outbox processed
  /ai/chat:
    post:
      operationId: aiChat
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Copilot / autopilot turn
  /ai/policy:
    get:
      operationId: getAiPolicy
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Autonomous action policy
    put:
      operationId: putAiPolicy
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Saved policy
  /ai/tools:
    get:
      operationId: listAiTools
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Tool registry (read / pack write / forbidden)
  /ai/usage:
    get:
      operationId: aiUsage
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Token usage summary
  /ai/models:
    post:
      operationId: listAiModels
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Catalog or live model ids (BFF; browser never calls the vendor)
  /ai/connection:
    get:
      operationId: getAiConnection
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Redacted deployment AI connection
    put:
      operationId: putAiConnection
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Saved vaulted connection
  /edge/nodes:
    get:
      operationId: listEdgeNodes
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Registered edge nodes
    post:
      operationId: registerEdgeNode
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Registered
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, thingsboard, security]
      properties:
        status: { type: string }
        service: { type: string }
        version: { type: string }
        mqtt: { type: string }
        thingsboard: { type: string, enum: [up, down, skipped] }
        notifications:
          type: object
          properties:
            alarmWebhookConfigured: { type: boolean }
        security:
          type: object
          required: [codes]
          properties:
            warningCount: { type: integer }
            codes:
              type: array
              items:
                type: string
                enum:
                  - CASBIN_DEV_OPEN
                  - JWT_SECRET_WEAK
                  - TB_PASSWORD_DEFAULT
                  - DB_PASSWORD_DEFAULT
        license:
          type: object
          properties:
            mode: { type: string }
            enforcement: { type: string, enum: [report_only, block] }
            sku: { type: string, nullable: true }
            verified: { type: boolean }
    DemoBootstrapRequest:
      type: object
      properties:
        projectName: { type: string }
        siteName: { type: string }
        assetName: { type: string }
    DemoBootstrap:
      type: object
      required: [project, pack, site, asset]
      properties:
        project:
          type: object
          required: [id]
          properties:
            id: { type: string }
            name: { type: string }
            tbTenantId: { type: string }
        pack:
          type: object
          required: [slug]
          properties:
            slug: { type: string }
            version: { type: string }
        site:
          type: object
          properties:
            id: { type: string }
            tbCustomerId: { type: string }
        asset:
          type: object
          required: [id]
          properties:
            id: { type: string }
            tbDeviceId: { type: string }
    AlarmRow:
      type: object
      required: [id, type, severity]
      properties:
        id: { type: string }
        type: { type: string }
        severity: { type: string }
        acknowledged: { type: boolean }
        cleared: { type: boolean }
        projectId: { type: string }
        assetId: { type: string }
        assetName: { type: string }
