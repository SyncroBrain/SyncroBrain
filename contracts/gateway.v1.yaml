openapi: 3.1.0
info:
  title: SyncroBrain Cloud Lite Gateway
  version: 0.1.0
  description: |
    Product Iterate HTTP surface on iot-gateway (NestJS Fastify).
    Server default is http://localhost:13200/api/v1.
    Device CRUD in device.v1.yaml is a legacy subset and is not the Cloud Lite contract.
    Optional VistaCast ingest is HMAC webhook at /integrations/vistacast/connections/{id}/events.
    Optional VistaRemote remote-device↔asset binding is at /integrations/vistaremote/*.
    Binding stores ids only and never starts a remote desktop session.
    Optional DoerFlow adapter is default-off at /integrations/doerflow/* (HMAC invoke/callback).
    DoerFlow is not a telemetry bus and is not ThingsBoard MQTT. Callbacks never close Incidents
    and never execute TB RPC; command suggestions go through Safety Kernel.
servers:
  - url: http://localhost:13200/api/v1
paths:
  /health:
    get:
      operationId: health
      description: Liveness. 200 while the process is alive. Never returns secrets.
      responses:
        "200":
          description: Gateway + ThingsBoard ping (TB_MODE=fake reports up)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      operationId: ready
      description: |
        Readiness judged solely by the control manifest
        (contracts/schemas/control-manifest.schema.json). Only components marked
        required fail closed. Optional components (Entitlement control plane, IdP,
        edge, sibling products such as VistaCast / VistaRemote / DoerFlow / DataLuminary) being
        down must never make a Cloud Lite standalone deployment not_ready — they
        report degraded instead. Never returns secrets or connection strings.
      responses:
        "200":
          description: ready (all required up) or degraded (an optional component is down)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: not_ready — a required component (postgres, or thingsboard when required) failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /version:
    get:
      operationId: version
      description: Version / commit / deploy profile / entitlement mode / manifest summary. No secrets.
      responses:
        "200":
          description: Version and deployment identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /ops/inventory:
    get:
      operationId: opsInventory
      responses:
        "200":
          description: Pilot inventory (no secrets)
  /branding:
    get:
      operationId: branding
      responses:
        "200":
          description: White-label stub
  /license:
    get:
      operationId: licenseStatus
      responses:
        "200":
          description: Offline license (report_only or block)
  /entitlement/skus:
    get:
      operationId: listSkus
      responses:
        "200":
          description: Configurable SKU catalog
  /auth/demo:
    post:
      operationId: demoLogin
      responses:
        "200":
          description: Demo JWT when CASBIN_DEV_OPEN=true
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
        "403":
          description: CASBIN_DEV_OPEN is not true
  /packs:
    get:
      operationId: listPacks
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Industry Pack catalog
  /demos/cold-lab:
    post:
      operationId: demoColdLab
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoBootstrapRequest"
      responses:
        "201":
          description: Project + Pack + site + asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoBootstrap"
  /demos/env-lab:
    post:
      operationId: demoEnvLab
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoBootstrapRequest"
      responses:
        "201":
          description: env-lab room demo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoBootstrap"
  /alarms:
    get:
      operationId: listAlarms
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Alarm rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlarmRow"
  /alarms/webhook/test:
    post:
      operationId: testAlarmWebhook
      security: [{ bearerAuth: [] }]
      description: |
        Requires iot.incident:ack. Pings ALARM_WEBHOOK_URL without creating a TB alarm.
      responses:
        "200":
          description: Delivery result of the ping (no TB alarm created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
  /alarms/webhook/last:
    get:
      operationId: getLastAlarmWebhook
      security: [{ bearerAuth: [] }]
      description: |
        Requires iot.incident:view. Last in-memory webhook POST (cleared on Gateway restart).
      responses:
        "200":
          description: configured flag plus last attempt or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookLastPeek"
  /alarms/export.csv:
    get:
      operationId: exportAlarmsCsv
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
  /alarms/{id}/ack:
    post:
      operationId: ackAlarm
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Acknowledged row
  /assets/{id}/simulate/overtemp:
    post:
      operationId: simulateOvertemp
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Telemetry + CRITICAL alarm
  /projects:
    get:
      operationId: listProjects
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Project list
    post:
      operationId: createProject
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /projects/{id}:
    get:
      operationId: getProject
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Project
    delete:
      operationId: deleteProject
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Removed mapped assets and TB tenant
  /projects/{id}/sites:
    get:
      operationId: listSites
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sites
    post:
      operationId: createSite
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Site
  /projects/{id}/packs/apply:
    post:
      operationId: applyPack
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pack application
        "403":
          description: PACK_NOT_ALLOWLISTED when BRAND_PACK_ALLOWLIST is set and the slug is outside it
  /assets:
    get:
      operationId: listAssets
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Asset maps
  /assets/{id}/telemetry:
    get:
      operationId: getAssetTelemetry
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Telemetry
  /audit-events:
    get:
      operationId: listAuditEvents
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Append-only audit
  /incidents:
    get:
      operationId: listIncidents
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Domain incidents
  /incidents/{id}:
    get:
      operationId: getIncident
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Incident with acknowledgements and escalations
  /incidents/{id}/ack:
    post:
      operationId: ackIncident
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Acknowledged
  /incidents/{id}/escalate:
    post:
      operationId: escalateIncident
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Escalated using duty roster
  /incidents/{id}/close:
    post:
      operationId: closeIncident
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Closed after ack
  /sites/{id}/duty-roster:
    get:
      operationId: getDutyRoster
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Site duty roster
    put:
      operationId: putDutyRoster
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Replaced duty roster
  /duty-roster/gaps:
    get:
      operationId: listDutyRosterGaps
      security: [{ bearerAuth: [] }]
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sites with no duty roster (must not be marked live)
  /calibrations:
    get:
      operationId: listCalibrations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: expired
          in: query
          required: false
          schema: { type: string, enum: ["1", "true"] }
        - name: channelId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Calibration certificates
    post:
      operationId: createCalibration
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /reports:
    get:
      operationId: listReports
      security: [{ bearerAuth: [] }]
      parameters:
        - name: siteId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Compliance reports
    post:
      operationId: createReport
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /reports/{id}/export:
    post:
      operationId: exportReport
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: CSV body plus metadata
  /assets/{id}/channels:
    get:
      operationId: listAssetChannels
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sensor channels seeded from Pack
  /work-orders:
    get:
      operationId: listWorkOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - name: incidentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Work orders from incident close
  /commands:
    post:
      operationId: dispatchCommand
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Command accepted or denied
    get:
      operationId: listCommands
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Command history
  /edge/commands:
    get:
      operationId: pullEdgeCommands
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pending outbox command payloads for EdgeAgent
  /edge/commands/receipt:
    post:
      operationId: edgeCommandReceipt
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Command receipt; marks outbox processed
  /ai/chat:
    post:
      operationId: aiChat
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Copilot / autopilot turn
  /ai/policy:
    get:
      operationId: getAiPolicy
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Autonomous action policy
    put:
      operationId: putAiPolicy
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Saved policy
  /ai/tools:
    get:
      operationId: listAiTools
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Tool registry (read / pack write / forbidden)
  /ai/usage:
    get:
      operationId: aiUsage
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Token usage summary
  /ai/models:
    post:
      operationId: listAiModels
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Catalog or live model ids (BFF; browser never calls the vendor)
  /ai/connection:
    get:
      operationId: getAiConnection
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Redacted deployment AI connection
    put:
      operationId: putAiConnection
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Saved vaulted connection
  /edge/nodes:
    get:
      operationId: listEdgeNodes
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Registered edge nodes
    post:
      operationId: registerEdgeNode
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Registered
  /controller-kits:
    get:
      operationId: listControllerKits
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Public Controller Kit catalog (ESP32 actuators and sensors)
  /controller-kits/{slug}:
    get:
      operationId: getControllerKit
      security: [{ bearerAuth: [] }]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Kit channel, command, and safety envelope
        "404":
          description: Unknown kit
  /projects/{id}/controllers/claim:
    post:
      operationId: claimController
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Official firmware or protocol bind; asset.kitSlug set
        "400":
          description: SERIAL / CHANNEL_GAP / BIND_PATH
  /projects/{id}/scenes:
    get:
      operationId: listScenes
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Pack scene recipes applied to the project
    post:
      operationId: createScene
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Site overlay scene (must stay inside kit allowlist)
  /scenes/{id}/evaluate:
    post:
      operationId: evaluateScene
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: string, format: uuid }
                projectId: { type: string, format: uuid }
                telemetry: { type: object, additionalProperties: true }
                intent: { type: object, additionalProperties: true }
                dispatch:
                  type: boolean
                  description: Students and classroom dry-run must send false; omitted defaults to true for operators
                killSwitch: { type: boolean }
      responses:
        "200":
          description: dispatch / hold / deny; deny reasons are fail-closed
  /education-labs/sessions:
    post:
      operationId: createEducationLabSession
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [projectId, assetId, kitSlug]
              properties:
                projectId: { type: string, format: uuid }
                assetId: { type: string, format: uuid }
                kitSlug: { type: string }
                ttlSeconds: { type: integer, minimum: 60, maximum: 3600 }
                allowlist:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Short-lived live lab session
        "400":
          description: KIT_MISMATCH
    get:
      operationId: listEducationLabSessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Teacher sessions
  /education-labs/sessions/{id}:
    get:
      operationId: getEducationLabSession
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
        "410":
          description: LAB_SESSION_EXPIRED
    delete:
      operationId: stopEducationLabSession
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Stopped
  /education-labs/sessions/{id}/intent:
    post:
      operationId: runEducationLabIntent
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sceneId: { type: string }
                commandId: { type: string }
                telemetry: { type: object, additionalProperties: true }
                intent: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Scene decision (may dispatch)
        "403":
          description: COMMAND_DENIED
        "410":
          description: LAB_SESSION_EXPIRED
        "503":
          description: DEVICE_OFFLINE
  /demos/smart-window:
    post:
      operationId: demoSmartWindow
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Window kit + rain-close / heat-vent scenes
  /demos/agri-irrigation:
    post:
      operationId: demoAgriIrrigation
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Valve kit + soil / rain-skip scenes
  /demos/agri-pond:
    post:
      operationId: demoAgriPond
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Pond aerator / spray scenes with level interlock
  /demos/vistacast-bridge:
    post:
      operationId: demoVistaCastBridge
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: string
                  enum: [industrial-safety, building-facility, home-care]
                projectName: { type: string }
                siteName: { type: string }
                assetName: { type: string }
                autoActionEnabled: { type: boolean }
      responses:
        "201":
          description: Pack demo plus VistaCast connection, binding, and a drill event
  /integrations/vistacast/profiles:
    get:
      operationId: listVistaCastProfiles
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: industrial-safety / building-facility / home-care profiles
  /integrations/vistacast/connections:
    get:
      operationId: listVistaCastConnections
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Connections (secrets never listed)
    post:
      operationId: createVistaCastConnection
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Connection created; webhookSecret returned once
  /integrations/vistacast/connections/{id}:
    get:
      operationId: getVistaCastConnection
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Connection (no secret)
    patch:
      operationId: patchVistaCastConnection
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteVistaCastConnection
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Removed
  /integrations/vistacast/connections/{id}/rotate-secret:
    post:
      operationId: rotateVistaCastWebhookSecret
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: New webhookSecret returned once
  /integrations/vistacast/connections/{id}/events:
    post:
      operationId: ingestVistaCastWebhook
      description: HMAC-SHA256 ingest. No user JWT. Header x-vistacast-signature.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Accepted (processed, duplicate, or quarantined)
        "401":
          description: Bad signature
        "413":
          description: Body too large
  /integrations/vistacast/bindings:
    get:
      operationId: listVistaCastBindings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: cameraId ↔ assetId rows
    post:
      operationId: upsertVistaCastBinding
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Bound
  /integrations/vistacast/bindings/{id}:
    delete:
      operationId: deleteVistaCastBinding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Unbound
  /integrations/vistacast/events:
    get:
      operationId: listVistaCastInbox
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Inbox rows including quarantined
  /integrations/vistacast/events/{id}/retry:
    post:
      operationId: retryVistaCastInbox
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reprocessed
  /integrations/vistaremote/status:
    get:
      operationId: vistaremoteStatus
      security: [{ bearerAuth: [] }]
      description: |
        Binding API is always present (enabled=true). siblingConfigured reflects
        VISTAREMOTE_BASE_URL. Never returns secrets. Down VistaRemote must not fail /ready.
      responses:
        "200":
          description: enabled / siblingConfigured / interventionEnabled flags only
  /integrations/vistaremote/connections:
    get:
      operationId: listVistaRemoteConnections
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Connections (ids and display fields only; never secrets)
    post:
      operationId: createVistaRemoteConnection
      security: [{ bearerAuth: [] }]
      description: Requires iot.integration:manage. Unique external tenantId. Unknown projectId is rejected.
      responses:
        "201":
          description: Connection created
        "400":
          description: TENANT_ALREADY_BOUND
        "404":
          description: Project not found
  /integrations/vistaremote/connections/{id}:
    get:
      operationId: getVistaRemoteConnection
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Connection (no secrets)
    delete:
      operationId: deleteVistaRemoteConnection
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Removed (bindings dropped; assets and Incidents are kept)
  /integrations/vistaremote/connections/{id}/intervention:
    post:
      operationId: requestVistaRemoteIntervention
      security: [{ bearerAuth: [] }]
      description: |
        Optional human-confirmation deep link (VistaRemote FR-SSI-01). Never auto-creates
        a remote session, never returns JWT/sessionId, never dispatches TB RPC.
        Requires VISTAREMOTE_BASE_URL and HMAC env; otherwise 404 INTEGRATION_DISABLED.
        HMAC headers X-VR-Intervention-Key-Id / Timestamp / Signature.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                remoteDeviceId: { type: string }
                assetId: { type: string, format: uuid }
                severity: { type: string, enum: [low, medium, high] }
      responses:
        "201":
          description: pending_user_confirmation with deepLink / webFallbackUrl only
        "404":
          description: INTEGRATION_DISABLED — sibling URL or HMAC env is not set
  /integrations/vistaremote/bindings:
    get:
      operationId: listVistaRemoteBindings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: remoteDeviceId ↔ assetId rows (ids and display names only)
    post:
      operationId: upsertVistaRemoteBinding
      security: [{ bearerAuth: [] }]
      description: |
        Unique (connectionId, remoteDeviceId). One asset may have at most one remote device.
        Unknown assetId is rejected; devices are never auto-created. Grants no command permission.
      responses:
        "201":
          description: Bound
        "400":
          description: ASSET_ALREADY_BOUND or ASSET_PROJECT_MISMATCH
        "404":
          description: Asset or connection not found
  /integrations/vistaremote/bindings/{id}:
    delete:
      operationId: deleteVistaRemoteBinding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Unbound (asset and Incidents are kept)
  /integrations/dataluminary/status:
    get:
      operationId: dataluminaryStatus
      security: [{ bearerAuth: [] }]
      description: |
        Optional DataLuminary embed/export status. DATALUMINARY_EMBED_ENABLED defaults to
        false. The Console iframe host is shipped but still default-off; the default board
        remains a ThingsBoard Dashboard. Reports allowlist sizes, iframeReady, and hostname
        only of DATALUMINARY_EMBED_BASE_URL — never secrets or URLs with query/userinfo.
      responses:
        "200":
          description: enabled flag, ttlSeconds, allowlisted origin/dashboard counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataLuminaryStatus"
  /integrations/dataluminary/embed-token:
    post:
      operationId: dataluminaryEmbedToken
      security: [{ bearerAuth: [] }]
      description: |
        Mints a short-lived, non-renewable, read-only embed grant
        (contracts/schemas/dataluminary-embed.schema.json). Requires iot.integration:manage.
        origin and dashboardId must both be on the explicit allowlist; wildcards are rejected.
        The grant carries projectId / dashboardId / aud / exp only — the browser never holds a
        DataLuminary API key, ThingsBoard credential or DB connection string. Issuance is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, dashboardId, origin]
              properties:
                projectId: { type: string, format: uuid }
                dashboardId: { type: string }
                origin: { type: string, format: uri }
      responses:
        "201":
          description: Short-lived embed grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataLuminaryEmbedGrant"
        "403":
          description: ORIGIN_NOT_ALLOWED or DASHBOARD_NOT_ALLOWED
        "404":
          description: INTEGRATION_DISABLED — DATALUMINARY_EMBED_ENABLED is not true
  /integrations/dataluminary/export:
    get:
      operationId: dataluminaryExport
      security: [{ bearerAuth: [] }]
      description: |
        Pull-mode aggregates for DataLuminary. Requires iot.integration:view and
        DATALUMINARY_EMBED_ENABLED. Returns hash/ref and window aggregates — never
        per-point telemetry, ThingsBoard device tokens, or MQTT topics.
      parameters:
        - name: projectId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: envelope
          in: query
          required: true
          schema:
            type: string
            enum: [syncrobrain.telemetry-digest.v1, syncrobrain.incident-report.v1]
        - name: window
          in: query
          required: false
          schema: { type: string, maxLength: 32, example: PT1H }
      responses:
        "200":
          description: Aggregates plus digestSha256 and ref
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataLuminaryExport"
        "404":
          description: INTEGRATION_DISABLED — DATALUMINARY_EMBED_ENABLED is not true
  /integrations/doerflow/status:
    get:
      operationId: doerflowStatus
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Default-off flag, license feature doerflow, frozen offerings
  /integrations/doerflow/offerings:
    get:
      operationId: listDoerflowOfferings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: syncrobrain.telemetry-digest.v1 and syncrobrain.incident-report.v1
  /integrations/doerflow/connections:
    get:
      operationId: listDoerflowConnections
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Tenant/project policy rows
    post:
      operationId: createDoerflowConnection
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created; invokeSecret once
        "503":
          description: DOERFLOW_DISABLED
  /integrations/doerflow/connections/{id}/register:
    post:
      operationId: registerDoerflowOfferings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: productCode/offeringCode/sourceTenantId/pricingUnit/readiness/endpointUrl/unitPrice/payee
  /integrations/doerflow/invoke:
    post:
      operationId: invokeDoerflowOffering
      description: HMAC CloudEvent type=com.doerflow.trading.job.invoke. Header x-doerflow-signature.
      responses:
        "200":
          description: Hash/ref payload
        "401":
          description: Bad HMAC
        "409":
          description: Duplicate invoke id
  /integrations/doerflow/callbacks:
    post:
      operationId: doerflowLifecycleCallback
      description: HMAC lifecycle. Never executes device commands.
      responses:
        "202":
          description: Stored suggestion or quarantined
        "401":
          description: Bad HMAC
  /integrations/doerflow/outbox:
    get:
      operationId: listDoerflowOutbox
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: CloudEvents com.syncrobrain.incident.v1 / com.syncrobrain.work-order.v1
  /integrations/doerflow/outbox/{id}/retry:
    post:
      operationId: retryDoerflowOutbox
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Retry toward /integrations/events
  /integrations/doerflow/work-orders:
    post:
      operationId: createDoerflowWorkOrder
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: needsExternal work order; no TB RPC
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, thingsboard, security]
      properties:
        status: { type: string }
        service: { type: string }
        version: { type: string }
        mqtt: { type: string }
        thingsboard: { type: string, enum: [up, down, skipped] }
        notifications:
          type: object
          properties:
            alarmWebhookConfigured: { type: boolean }
        security:
          type: object
          required: [codes]
          properties:
            warningCount: { type: integer }
            codes:
              type: array
              items:
                type: string
                enum:
                  - CASBIN_DEV_OPEN
                  - JWT_SECRET_WEAK
                  - TB_PASSWORD_DEFAULT
                  - DB_PASSWORD_DEFAULT
        license:
          type: object
          properties:
            mode: { type: string }
            enforcement: { type: string, enum: [report_only, block] }
            sku: { type: string, nullable: true }
            verified: { type: boolean }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, degraded, not_ready]
          description: degraded is still HTTP 200 (optional component down); only not_ready is 503.
        topology: { type: string, enum: [standalone, external-db, control-plane, ha] }
        manifestSource: { type: string, enum: [default, file] }
        checks:
          type: object
          required: [required, optional]
          properties:
            required:
              type: array
              items: { $ref: "#/components/schemas/ReadinessCheck" }
            optional:
              type: array
              items: { $ref: "#/components/schemas/ReadinessCheck" }
        warnings:
          type: array
          items:
            type: string
            enum:
              - ENTITLEMENT_SHADOW
              - ENTITLEMENT_CONTROL_PLANE_UNREACHABLE
              - MANIFEST_SIBLING_REQUIRED
              - MANIFEST_INVALID
              - IDP_NOT_CONFIGURED
    ReadinessCheck:
      type: object
      required: [key, kind, state]
      properties:
        key: { type: string }
        kind:
          type: string
          enum: [database, runtime, control-plane, identity, edge, sibling-product, event-bus]
        state: { type: string, enum: [up, down, skipped] }
        latencyMs: { type: integer, nullable: true }
        reason: { type: string, nullable: true, description: Machine code only — never a connection string. }
    VersionInfo:
      type: object
      required: [service, version, deployProfile, entitlementMode]
      properties:
        service: { type: string, const: iot-gateway }
        version: { type: string }
        commit: { type: string, nullable: true }
        node: { type: string }
        deployProfile: { type: string, enum: [dev, prod, private, ha] }
        entitlementMode:
          type: string
          enum: [off, shadow, enforce, offline_license]
        oidc:
          type: object
          properties:
            configured: { type: boolean }
            issuerHost: { type: string, nullable: true, description: Host only — never the full URL with query or credentials. }
        manifest:
          type: object
          properties:
            source: { type: string, enum: [default, file] }
            topology: { type: string }
            requiredKeys:
              type: array
              items: { type: string }
    DataLuminaryStatus:
      type: object
      required: [enabled, implemented]
      properties:
        enabled: { type: boolean, description: DATALUMINARY_EMBED_ENABLED }
        implemented:
          type: boolean
          description: |
            True once the Console iframe host exists in this release. Independent of
            DATALUMINARY_EMBED_ENABLED. The default board remains a ThingsBoard Dashboard
            until embed is explicitly enabled.
        iframeReady:
          type: boolean
          description: True only when embed is enabled and DATALUMINARY_EMBED_BASE_URL is set.
        embedBaseHost:
          type: string
          description: Hostname only of DATALUMINARY_EMBED_BASE_URL — never query or userinfo. Omitted when unset.
        ttlSeconds: { type: integer }
        allowedOriginCount: { type: integer }
        allowedDashboardCount: { type: integer }
        allowedDashboards:
          type: array
          items: { type: string }
        exportEnvelopes:
          type: array
          items:
            type: string
            enum: [syncrobrain.telemetry-digest.v1, syncrobrain.incident-report.v1]
    DataLuminaryExport:
      type: object
      required: [offeringCode, digestSha256, ref]
      properties:
        offeringCode:
          type: string
          enum: [syncrobrain.telemetry-digest.v1, syncrobrain.incident-report.v1]
        digestSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        ref: { type: string }
        projectId: { type: string, format: uuid }
        assetCount: { type: integer }
        sampleCount: { type: integer }
        incidentCount: { type: integer }
        windowLabel: { type: string }
        window:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        batch:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        series:
          type: array
          description: Key-level aggregates (min/max/avg/n) only — never per-point samples.
          items:
            type: object
            properties:
              key: { type: string }
              min: { type: number }
              max: { type: number }
              avg: { type: number }
              n: { type: integer }
    DataLuminaryEmbedGrant:
      type: object
      required: [embedVersion, projectId, dashboardId, origin, token, expiresAt, ttlSeconds]
      properties:
        embedVersion: { type: string, const: "1" }
        projectId: { type: string, format: uuid }
        dashboardId: { type: string }
        origin: { type: string, format: uri }
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        ttlSeconds: { type: integer, minimum: 30, maximum: 900 }
        scope: { type: string, const: "dashboard:read" }
    DemoBootstrapRequest:
      type: object
      properties:
        projectName: { type: string }
        siteName: { type: string }
        assetName: { type: string }
    DemoBootstrap:
      type: object
      required: [project, pack, site, asset]
      properties:
        project:
          type: object
          required: [id]
          properties:
            id: { type: string }
            name: { type: string }
            tbTenantId: { type: string }
        pack:
          type: object
          required: [slug]
          properties:
            slug: { type: string }
            version: { type: string }
        site:
          type: object
          properties:
            id: { type: string }
            tbCustomerId: { type: string }
        asset:
          type: object
          required: [id]
          properties:
            id: { type: string }
            tbDeviceId: { type: string }
    AlarmRow:
      type: object
      required: [id, type, severity]
      properties:
        id: { type: string }
        type: { type: string }
        severity: { type: string }
        acknowledged: { type: boolean }
        cleared: { type: boolean }
        projectId: { type: string }
        assetId: { type: string }
        assetName: { type: string }
        siteName: { type: string }
        tbDeviceId: { type: string, description: ThingsBoard originator entity id }
        quality:
          type: string
          enum: [ok, unmapped]
          description: ok when the TB originator is in asset_maps; unmapped otherwise
    WebhookResult:
      type: object
      required: [delivered]
      properties:
        delivered: { type: boolean }
        skipped: { type: boolean, description: True when ALARM_WEBHOOK_URL is unset }
        status: { type: integer }
        error: { type: string }
    WebhookLastPeek:
      type: object
      required: [configured, last]
      properties:
        configured:
          type: boolean
          description: True when ALARM_WEBHOOK_URL is set
        last:
          nullable: true
          description: Last in-memory POST; null if none yet; cleared on Gateway restart
          allOf:
            - $ref: "#/components/schemas/WebhookLast"
    WebhookLast:
      type: object
      required: [at, event, target, delivered, payload]
      properties:
        at: { type: string, format: date-time }
        event: { type: string }
        target:
          type: string
          nullable: true
          description: Redacted URL origin+pathname when configured; null when skipped
        delivered: { type: boolean }
        skipped: { type: boolean }
        status: { type: integer }
        error: { type: string }
        payload:
          $ref: "#/components/schemas/WebhookEnvelope"
    WebhookEnvelope:
      type: object
      required: [source, event, at, alarm, site, asset, type, severity, openedAt, drill, deepLink]
      properties:
        source: { type: string, const: syncrobrain-iot-gateway }
        event: { type: string, description: alarm.created / alarm.acked / alarm.cleared }
        at: { type: string, format: date-time }
        alarm:
          type: object
          additionalProperties: true
          description: Nested alarm row kept as-is
        site: { type: string, nullable: true, description: siteName else siteId }
        asset: { type: string, nullable: true, description: assetName else assetId }
        type: { type: string, nullable: true }
        severity: { type: string, nullable: true }
        openedAt: { type: string, format: date-time }
        drill: { type: boolean }
        deepLink:
          type: string
          description: |
            CONSOLE_PUBLIC_URL with no trailing slash, plus /incidents?project= when
            alarm.projectId is present; otherwise /incidents.
